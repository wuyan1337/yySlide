name: Set up yySlide toolchain
description: >
  Install and cache the full build toolchain — JDK 17, Android SDK/NDK/CMake,
  Go + gomobile, Rust + cargo-ndk — shared by the CI and Release workflows.
  Everything downloadable is cached; only the toolchain install steps that
  can't be cached (setup-java, setup-android, setup-go) re-run each time,
  but those complete in seconds off the runner image.

inputs:
  project-directory:
    description: Path from the checkout root to the Android project
    required: false
    default: .

runs:
  using: composite
  steps:
    # Free ~25GB of preinstalled software we don't use so Android SDK + NDK +
    # Go + Rust + gradle caches fit on the runner disk.
    - name: Free disk space
      # v1.3.1, pinned so a mutable branch cannot change code executed in CI.
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        tool-cache: false
        android: false
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Install glibc cross-compilers for wayvnc shim
      shell: bash
      working-directory: ${{ inputs.project-directory }}
      # core/local's buildWayvncShim Gradle task needs glibc-targeted
      # aarch64 + x86_64 C compilers — the wayvnc capture-fallback shim
      # runs inside the proot rootfs alongside glibc-based wayvnc, not
      # on Android. The NDK's bionic libc is incompatible. Same package
      # the reproducible Linux release environment installs explicitly.
      #
      # `libc6-dev-arm64-cross` and `libc6-dev-amd64-cross` ship the
      # multi-arch glibc headers (e.g. bits/wordsize.h that pulls in
      # via features-time64.h on Debian trixie) — the GHA Ubuntu image
      # only has the native-arch libc6-dev, and `jlumbroso/free-disk-space`
      # below strips even more. Without these, the cross gcc fails at
      # compile time with "bits/wordsize.h: No such file or directory".
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
          gcc-x86-64-linux-gnu libc6-dev-amd64-cross \
          make binutils gawk pkg-config perl nasm \
          autoconf automake libtool

    - name: Set up JDK 17
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

    # Only install the NDK we pin in per-module ndkVersion
    # (core/local + termlib/lib: 29.0.14206865, r29 stable). Installing
    # and exporting exactly one revision prevents hosted-runner image
    # updates from changing native output underneath an unchanged commit.
    - name: Install SDK platform 36, CMake, and NDK
      shell: bash
      working-directory: ${{ inputs.project-directory }}
      run: sdkmanager "platforms;android-36" "cmake;3.31.6" "ndk;29.0.14206865"

    - name: Export pinned Android NDK
      shell: bash
      run: |
        sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
        ndk_home="$sdk_root/ndk/29.0.14206865"
        if [ ! -f "$ndk_home/source.properties" ]; then
          echo "::error::Pinned Android NDK not found at $ndk_home"
          exit 1
        fi
        echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=$ndk_home" >> "$GITHUB_ENV"
        echo "$sdk_root/cmake/3.31.6/bin" >> "$GITHUB_PATH"

    - name: Set up Go toolchain
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: '1.26.1'
        cache-dependency-path: ${{ inputs.project-directory }}/rclone-android/go/go.sum

    # gomobile + gobind get re-downloaded + recompiled on every clean run
    # (~1m). Cache the installed binaries in ~/go/bin keyed on the Go
    # version so repeat runs skip the `go install`.
    - name: Cache gomobile binaries
      id: gomobile-cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/go/bin/gomobile
          ~/go/bin/gobind
        key: gomobile-${{ runner.os }}-go1.26.1-xmobile-6129f5bee9d5

    - name: Install gomobile
      if: steps.gomobile-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.project-directory }}
      run: |
        go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260709172247-6129f5bee9d5
        go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260709172247-6129f5bee9d5

    # Tool-version pins below are the repository's authoritative release
    # environment. If com.yyslide.android is submitted to F-Droid later,
    # its recipe must be kept in lockstep with these versions.
    - name: Cache cargo-ndk
      id: cargo-ndk-cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cargo/bin/cargo-ndk
        key: cargo-ndk-${{ runner.os }}-4.1.2

    - name: Set up Rust toolchain + cargo-ndk
      shell: bash
      working-directory: ${{ inputs.project-directory }}
      run: |
        rustup default 1.97.1
        rustup target add aarch64-linux-android x86_64-linux-android
        if [ ! -x ~/.cargo/bin/cargo-ndk ]; then
          cargo install cargo-ndk --locked --version 4.1.2
        fi

    - name: Cache Gradle packages
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles(format('{0}/**/*.gradle*', inputs.project-directory), format('{0}/**/gradle-wrapper.properties', inputs.project-directory), format('{0}/**/libs.versions.toml', inputs.project-directory)) }}
        restore-keys: gradle-${{ runner.os }}-

    - name: Cache Cargo registry + rdp-kotlin target
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ inputs.project-directory }}/rdp-kotlin/build/cargo-target
        key: cargo-${{ runner.os }}-${{ hashFiles(format('{0}/rdp-kotlin/rust/Cargo.lock', inputs.project-directory)) }}
        restore-keys: cargo-${{ runner.os }}-

    - name: Grant execute permission for gradlew
      shell: bash
      working-directory: ${{ inputs.project-directory }}
      run: chmod +x gradlew
