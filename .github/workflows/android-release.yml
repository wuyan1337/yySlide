name: Android Release

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

# This is the yySlide monorepo's authoritative and only Android release
# workflow. It reuses composite actions from the Android project directory.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Run JavaScript actions on Node 24 ahead of GitHub's Node 20 retirement.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    shell: bash
    working-directory: android/yyslide-android

jobs:
  test:
    name: Release tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Validate Android release tag
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version_name="$(
            sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              app/build.gradle.kts | head -n 1
          )"
          if [ -z "$version_name" ]; then
            echo "::error::Could not read Android versionName from app/build.gradle.kts"
            exit 1
          fi

          expected_tag="android-v${version_name}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "::error::Android release tag must be $expected_tag, got $RELEASE_TAG"
            exit 1
          fi

      - name: Initialise test submodules with retry
        uses: ./android/yyslide-android/.github/actions/init-submodules-with-retry
        with:
          project-directory: android/yyslide-android
          # Release unit tests do not need the recursive Wayland/freedesktop
          # dependency chain; the signed build job still initialises it.
          paths: |
            termlib
            mosh-kotlin
            et-kotlin
            reticulum-kt
            rnsh-kt
            build-proot/proot-termux

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          check-latest: false

      - name: Set up Android build toolchain
        uses: ./android/yyslide-android/.github/actions/setup-toolchain
        with:
          project-directory: android/yyslide-android

      - name: Audit Android UI copy
        run: node ../../scripts/android-copy-audit.cjs

      - name: Run release unit tests for both ABI flavors
        run: ./gradlew testArm64ReleaseUnitTest testX64ReleaseUnitTest

  build:
    name: Signed ${{ matrix.abi }} APK and AAB
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64
            flavor: Arm64
          - abi: x64
            flavor: X64
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Initialise all Android submodules with retry
        uses: ./android/yyslide-android/.github/actions/init-submodules-with-retry
        with:
          project-directory: android/yyslide-android

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          check-latest: false

      - name: Set up Android build toolchain
        uses: ./android/yyslide-android/.github/actions/setup-toolchain
        with:
          project-directory: android/yyslide-android

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required Android signing secret $name is not configured"
              exit 1
            fi
          done

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > yyslide-release.jks
          test -s yyslide-release.jks

      - name: Build signed APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          ./gradlew
          ":app:assemble${{ matrix.flavor }}Release"
          ":app:bundle${{ matrix.flavor }}Release"

      - name: Remove decoded keystore
        if: always()
        run: rm -f yyslide-release.jks

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yyslide-${{ matrix.abi }}-release
          path: |
            android/yyslide-android/app/build/outputs/apk/${{ matrix.abi }}/release/yyslide-*-release.apk
            android/yyslide-android/app/build/outputs/bundle/${{ matrix.abi }}Release/*.aab
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download arm64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: yyslide-arm64-release
          path: release/arm64

      - name: Download x64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: yyslide-x64-release
          path: release/x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/**/*.apk
            release/**/*.aab
