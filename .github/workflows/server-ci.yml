name: Server CI

on:
  push:
    paths:
      - "server/**"
      - "scripts/sync-contract-check.cjs"
      - "scripts/server-security-check.cjs"
      - "scripts/decrypt-legacy-archive.cjs"
      - "package.json"
      - ".node-version"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "scripts/sync-contract-check.cjs"
      - "scripts/server-security-check.cjs"
      - "scripts/decrypt-legacy-archive.cjs"
      - "package.json"
      - ".node-version"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          check-latest: true
      - name: Check server syntax
        run: |
          node --check server/yycloud.cjs
          node --check scripts/sync-contract-check.cjs
          node --check scripts/server-security-check.cjs
          node --check scripts/decrypt-legacy-archive.cjs
      - name: Run root regression tests
        run: npm test
